[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-snip"
version = "0.1.0"
description = "Budget-aware context optimization for Agent Skills and LLM tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Snip contributors" }]
keywords = ["agent-skills", "llm", "tokens", "context", "skill-md"]
dependencies = []

[project.urls]
Repository = "https://github.com/Yashp-5/agent-snip"

